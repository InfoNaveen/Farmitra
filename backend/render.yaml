services:
  - type: web
    name: farmitra-backend
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt && python generate_price_data.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: HF_MODEL
        value: linkanjarad/mobilenet_v2_1.0_224-plant-disease-identification
    healthCheckPath: /health
